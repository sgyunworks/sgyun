<svg xmlns="http://www.w3.org/2000/svg" width="1042" height="2400" viewBox="0 0 1042 2400">
<defs>
  <filter id="drop" x="-10%" y="-20%" width="120%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="contact" x="-5%" y="-10%" width="110%" height="130%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="9"/></filter>
  <linearGradient id="rail" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#F7F5F1"/><stop offset=".55" stop-color="#EEEBE5"/><stop offset="1" stop-color="#E1DDD6"/>
  </linearGradient>
  <linearGradient id="lip" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".45" stop-color="#FFFFFF" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="field" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#F3F1EC"/><stop offset="1" stop-color="#ECE9E3"/>
  </linearGradient>
  <radialGradient id="lamp" cx=".72" cy=".5" r=".75">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
  </radialGradient>
  <pattern id="holes" patternUnits="userSpaceOnUse" x="91.63" y="47.53" width="28" height="28">
    <circle cx="12.7" cy="14" r="2.5" fill="#FFFFFF" fill-opacity=".9"/>
    <circle cx="14" cy="14" r="2.15" fill="#8E877D" fill-opacity=".62"/>
  </pattern>
  <clipPath id="fieldClip"><rect x="67.89" y="23.68" width="2259.47" height="915.7" rx="145.26"/></clipPath>
  <linearGradient id="slot" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1F1F21"/><stop offset=".5" stop-color="#2C2C2F"/><stop offset="1" stop-color="#1F1F21"/>
  </linearGradient>
</defs>

<!-- shadows on the page -->
<rect x="16.68" y="81.63" width="929.7" height="2291.47" rx="166.26" fill="#3C3024" fill-opacity=".17" filter="url(#drop)"/>
<rect x="4.68" y="56.63" width="953.7" height="2301.47" rx="166.26" fill="#3C3024" fill-opacity=".22" filter="url(#contact)"/>
<g transform="translate(0 2400) rotate(-90)">
<!-- thin rounded rail -->
<rect x="46.89" y="2.68" width="2301.47" height="957.7" rx="166.26" fill="url(#rail)"/>
<rect x="48.39" y="4.18" width="2298.47" height="954.7" rx="164.76" fill="none" stroke="url(#lip)" stroke-width="2.5"/>

<!-- recessed playing surface -->
<rect x="67.89" y="23.68" width="2259.47" height="915.7" rx="145.26" fill="url(#field)"/>
<g clip-path="url(#fieldClip)">
  <rect x="67.89" y="23.68" width="2259.47" height="915.7" fill="url(#lamp)"/>
  <rect x="83.89" y="39.68" width="2227.47" height="883.7" rx="115.26" fill="url(#holes)"/>
  <!-- printed markings -->
  <line x1="1197.63" y1="23.68" x2="1197.63" y2="939.38" stroke="#F05A1E" stroke-width="4"/>
  <circle cx="1197.63" cy="481.53" r="151.09" fill="none" stroke="#9C968D" stroke-width="3"/>
  <circle cx="67.89" cy="481.53" r="183.14" fill="none" stroke="#9C968D" stroke-width="3"/>
  <circle cx="2327.37" cy="481.53" r="183.14" fill="none" stroke="#9C968D" stroke-width="3"/>
  <!-- ambient occlusion where the surface meets the rail (stronger at the top: light from above) -->
  <rect x="57.89" y="13.68" width="2273.47" height="935.7" rx="155.26" fill="none" stroke="#4A3B2C" stroke-opacity=".3" stroke-width="22" filter="url(#soft)"/>
</g>

<!-- goal slots -->
<rect x="64.74" y="322.07" width="25.26" height="320.49" rx="12.63" fill="url(#slot)"/>
<rect x="65.74" y="323.07" width="23.26" height="318.49" rx="11.63" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="2"/>
<rect x="2308.42" y="322.07" width="25.26" height="320.49" rx="12.63" fill="url(#slot)"/>
<rect x="2309.42" y="323.07" width="23.26" height="318.49" rx="11.63" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="2"/>
</g>
</svg>